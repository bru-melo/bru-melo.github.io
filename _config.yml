# ------------------------------------------------------------------
#  Site settings — edit these first
# ------------------------------------------------------------------
title: Bruna Chagas de Melo
short_name: Bru
role: Seismologist · Postdoctoral Researcher
affiliation: Dublin Institute for Advanced Studies (DIAS)
location: Dublin, Ireland
tagline: >-
  I work on seismic imaging across scales, from the South American upper
  mantle to the Irish crust. My current research uses Distributed Acoustic
  Sensing on existing telecom fibre to monitor cities and the deep ocean.
description: >-
  Bruna Chagas de Melo, seismologist at DIAS. Seismic tomography, Distributed
  Acoustic Sensing (DAS) on urban telecom fibre, publications, datasets and code.

email: bmeloseismo@gmail.com
email_work: bmelo@cp.dias.ie   # institutional, shown in Contact
# Square photo (replace the file to change it)
photo: /assets/img/photo.jpg
# Add your CV at assets/cv/cv.pdf, then uncomment:
# cv_pdf: /assets/cv/cv.pdf

# If the repo is named <username>.github.io leave baseurl empty.
# If it is a project repo (e.g. github.com/bru-melo/website) set baseurl: "/website"
url: "https://bru-melo.github.io"
baseurl: ""

# No GitHub Pages theme: the site has its own layouts and stylesheet.
# (Without this, Pages adds its default Primer theme.)
theme: null

# ------------------------------------------------------------------
#  Search engines and link previews
# ------------------------------------------------------------------
# jekyll-seo-tag writes the meta description, canonical URL and
# Open Graph / Twitter tags (the <title> is set in _layouts/default.html). jekyll-sitemap writes /sitemap.xml.
# Both are supported by GitHub Pages out of the box.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

lang: en_IE
# Shown after your name in the browser tab and Google results
seo_title_suffix: Seismologist at DIAS, Dublin
author:
  name: Bruna Chagas de Melo
  url: https://bru-melo.github.io
# Image used when the site is shared (LinkedIn, Bluesky, Slack, ...)
logo: /assets/img/photo.jpg
# The photo is square, so use the small square preview card
twitter:
  card: summary
social:
  name: Bruna Chagas de Melo
  links:
    - https://orcid.org/0000-0002-9007-733X
    - https://github.com/bru-melo
    - https://www.researchgate.net/profile/Bruna-Chagas-De-Melo-2
    - https://www.linkedin.com/in/brumelo/

# Paste the codes from Google Search Console / Bing Webmaster Tools here
# (only the content="..." value), then uncomment.
# webmaster_verifications:
#   google: XXXXXXXXXXXXXXXXXXXX
#   bing: XXXXXXXXXXXXXXXXXXXX

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/photo.jpg
  # Google Search Console verification file: keep it, but out of the sitemap
  - scope:
      path: "google*.html"
    values:
      sitemap: false

markdown: kramdown
permalink: /blog/:year/:title/
exclude: [README.md, Gemfile, Gemfile.lock, vendor]
