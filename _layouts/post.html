---
layout: default
---
<article class="post wrap">
  <a class="back" href="{{ '/#blog' | relative_url }}">← back to the main page</a>
  <p class="post-date">{{ page.date | date: "%-d %B %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <div class="prose">
    {{ content }}
  </div>
</article>
