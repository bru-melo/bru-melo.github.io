<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.seo_title_suffix }}{% endif %}</title>
  {% seo title=false %}
  {%- if page.url == "/" %}
  {% include person-jsonld.html %}
  {%- endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav" aria-label="Sections">
      <a href="{{ '/#overview' | relative_url }}">Overview</a>
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/#publications' | relative_url }}">Publications</a>
      <a href="{{ '/#data-code' | relative_url }}">Data &amp; code</a>
      <a href="{{ '/#fieldwork' | relative_url }}">Fieldwork</a>
      <a href="{{ '/#outreach' | relative_url }}">Outreach</a>
      <a href="{{ '/#cv' | relative_url }}">CV</a>
      <a href="{{ '/#beyond' | relative_url }}">Beyond</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
    <button class="theme" type="button" aria-label="Toggle dark mode" data-theme-toggle>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m11.32 0 1.41 1.41M4.93 4.93l1.41 1.41M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-trace" aria-hidden="true"></div>
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
