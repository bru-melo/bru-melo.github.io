# Field campaigns and deployments, newest first.
# Fields: years, title, place, role, kit (list of instruments), detail, link (optional)

# CHECK: add ship name, sea area, number of OBSs and project name if wanted
- years: Nov 2026
  title: Ocean-bottom seismometer deployment cruise
  place: Irish offshore, with the Marine Institute
  role: Scientific party
  kit: [Ocean-bottom seismometers]
  detail: >-
    Ship-based deployment of ocean-bottom seismometers (OBSs), carried out in
    coordination with the Marine Institute, sailing on 13 November 2026.

- years: 2025–now
  title: SmartScape city-scale DAS deployment
  place: Dublin, Ireland
  role: Deployment lead
  kit: [ASN OptoDAS, telecom fibre]
  detail: >-
    Designed, installed and operate a Distributed Acoustic Sensing system on a
    Dublin city telecom fibre loop, coordinating access with CONNECT, Asiera
    and Dublin City Council. Responsible for data quality and metadata.

# CHECK: confirm the year of the pilot
- years: 2025
  title: Grangegorman DAS pilot
  place: Dublin, Ireland
  role: Field team
  kit: [FEBUS A1]
  detail: >-
    23-day pilot recording ahead of the city-loop deployment.

- years: 2025–now
  title: DAS calibration experiments
  place: Dublin, Ireland
  role: Lead
  kit: [DAS, dark fibre]
  detail: >-
    Controlled experiments to calibrate the DAS response and locate channels
    along the fibre, including tram-stop calibration on the Luas Green Line.

