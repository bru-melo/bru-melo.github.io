# Field campaigns and deployments, newest first.
# Fields: years, title, project (shown as a tag), place, role, kit (list of instruments), detail, link (optional)

# CHECK: add ship name, sea area and number of OBSs if wanted
- years: Nov 2026
  title: OBS deployment cruise
  project: SolasMara
  place: Irish offshore, with the Marine Institute
  role: Scientific lead
  kit: [OBS]
  detail: >-
    Ship-based deployment of OBSs, carried out in coordination with the
    Marine Institute, sailing on 13 November 2026.

- years: 2025–now
  title: SmartScape city-scale DAS deployment
  project: SmartScape
  place: Dublin, Ireland
  role: Deployment lead
  kit: [ASN OptoDAS, telecom fibre]
  detail: >-
    Designed, installed and operate a Distributed Acoustic Sensing system on a
    Dublin city telecom fibre loop, coordinating access with CONNECT, Asiera
    and Dublin City Council. Responsible for data quality and metadata.

# CHECK: confirm the year of the pilot
- years: 2025
  title: Grangegorman DAS pilot
  project: SmartScape
  place: Dublin, Ireland
  role: Field team
  kit: [FEBUS A1]
  detail: >-
    23-day pilot recording ahead of the city-loop deployment.

