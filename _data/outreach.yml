- years: 2018–2019
  title: SEA-SEIS ship-to-school programme
  detail: >-
    Coordinated live video sessions between the research vessel and schools
    across Ireland and the UK during the ocean-bottom seismometer deployment,
    then led follow-up classroom sessions where students named the
    seismometers and wrote stories inspired by the science.
